<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | TabiNote</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <header class="topbar auth-topbar"><a class="brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">T</span><span>TabiNote</span></a><a class="nav-link" href="{{ url_for('auth.register') }}">新規登録</a></header>
  <main class="auth-shell">
    <section class="auth-card">
      <span class="step-label">WELCOME BACK</span>
      <h1>おかえりなさい</h1>
      <p class="auth-description">ログインして、旅のプランをつくりましょう。</p>
      {% if error %}<div class="notice auth-notice" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label class="field-label" for="email">メールアドレス</label>
        <input class="auth-input" id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required>
        <label class="field-label" for="password">パスワード</label>
        <input class="auth-input" id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="primary-button auth-submit" type="submit">ログイン <span>→</span></button>
      </form>
      <p class="auth-switch">アカウントをお持ちでない方は <a href="{{ url_for('auth.register') }}">新規登録</a></p>
    </section>
  </main>
</body>
</html>
