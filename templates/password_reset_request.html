{% extends "base.html" %}
{% block title %}パスワードを忘れた場合 | Tabidea{% endblock %}
{% block content %}
<div class="auth-wrap">
  <section class="card">
    <span class="eyebrow">ACCOUNT RECOVERY</span>
    <h1 style="margin:10px 0">パスワードを忘れた場合</h1>
    <p class="muted">登録したメールアドレスと復旧コードを入力してください。一致すると新しいパスワードを設定できます。</p>
    <form method="post" action="{{ url_for('password_reset_request') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="reset-email">メールアドレス</label>
        <input id="reset-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="field" style="margin-top:16px">
        <label for="recovery-password">復旧コード</label>
        <input id="recovery-password" name="recovery_password" type="password" autocomplete="current-password" required placeholder="設定した復旧コード">
      </div>
      <div class="form-actions"><button type="submit">確認して次へ</button></div>
    </form>
    <p class="hint" style="text-align:center"><a href="#recovery-code-help" data-recovery-code-help style="font-weight:700;text-decoration:underline;text-underline-offset:0.16em">復旧コードを忘れた場合</a></p>
    <p class="hint" style="text-align:center"><a href="{{ url_for('auth',mode='login') }}" style="text-decoration:underline;text-underline-offset:0.16em">ログイン画面へ戻る</a></p>
  </section>
</div>
{% endblock %}
