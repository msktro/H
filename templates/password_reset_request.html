{% extends "base.html" %}
{% block title %}パスワードを忘れた場合 | Tabidea{% endblock %}
{% block content %}
<div class="auth-wrap">
  <section class="card">
    <span class="eyebrow">ACCOUNT RECOVERY</span>
    <h1 style="margin:10px 0">パスワードを忘れた場合</h1>
    <p class="muted">登録したメールアドレスを入力してください。アカウントがある場合、パスワード再設定用リンクを発行します。</p>
    <form method="post" action="{{ url_for('password_reset_request') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="reset-email">メールアドレス</label>
        <input id="reset-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="form-actions"><button type="submit">再設定リンクを発行</button></div>
    </form>
    <p class="notice" style="margin-top:18px">開発環境では、リンクをFlask起動中のターミナルに表示します。メール送信を使う場合はSMTP設定が必要です。</p>
    <p class="hint" style="text-align:center"><a href="{{ url_for('auth',mode='login') }}">ログイン画面へ戻る</a></p>
  </section>
</div>
{% endblock %}
