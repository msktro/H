<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新規登録 | TabiNote</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <header class="topbar auth-topbar"><a class="brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">T</span><span>TabiNote</span></a><a class="nav-link" href="{{ url_for('auth.login') }}">ログイン</a></header>
  <main class="auth-shell">
    <section class="auth-card">
      <span class="step-label">START YOUR JOURNEY</span>
      <h1>アカウントを作成</h1>
      <p class="auth-description">登録して、あなただけの旅の計画を始めましょう。</p>
      {% if error %}<div class="notice auth-notice" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label class="field-label" for="display_name">表示名</label>
        <input class="auth-input" id="display_name" name="display_name" type="text" autocomplete="nickname" maxlength="80" value="{{ values.display_name }}" required>
        <label class="field-label" for="email">メールアドレス</label>
        <input class="auth-input" id="email" name="email" type="email" autocomplete="email" value="{{ values.email }}" required>
        <label class="field-label" for="password">パスワード <small>8文字以上</small></label>
        <input class="auth-input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <button class="primary-button auth-submit" type="submit">アカウントを作成 <span>→</span></button>
      </form>
      <p class="auth-switch">すでにアカウントをお持ちの方は <a href="{{ url_for('auth.login') }}">ログイン</a></p>
    </section>
  </main>
</body>
</html>
