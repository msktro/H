<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="{{ url_for('static',filename='favicon.svg',v='20261113-1') }}">
  <title>{{ error_title }} | Tabidea</title>
  <style>
    :root{font-family:"Yu Gothic UI",Meiryo,system-ui,sans-serif;color:#18352f;background:#f5f7f3}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
    header,footer{background:#fff;padding:18px max(24px,calc((100% - 1120px)/2));border-bottom:1px solid #e4eae5}
    footer{border-top:1px solid #e4eae5;border-bottom:0;color:#6e807b;font-size:.9rem}
    .brand{color:#087866;font-size:1.35rem;font-weight:800;text-decoration:none}
    main{display:grid;place-items:center;padding:36px 20px}.card{width:min(100%,620px);padding:clamp(28px,6vw,56px);border:1px solid #e4eae5;border-radius:24px;background:#fff;box-shadow:0 18px 45px #18352f12;text-align:center}
    .icon{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 20px;border-radius:22px;background:#e7f2ec;color:#087866;font-size:2rem}
    .code{color:#78908a;font-size:.82rem;font-weight:700;letter-spacing:.12em}.card h1{margin:10px 0 14px;font-size:clamp(1.5rem,4vw,2rem)}.card p{color:#637a74;line-height:1.9}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:28px}.actions a,.actions button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border:0;border-radius:12px;background:#126c5b;color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.actions .secondary{background:#e7f2ec;color:#126c5b}
  </style>
</head>
<body>
  <header><a class="brand" href="/">✈ Tabidea</a></header>
  <main><section class="card" role="alert">
    <div class="icon" aria-hidden="true">☁</div>
    <div class="code">ERROR {{ error_code }}</div>
    <h1>{{ error_title }}</h1>
    <p>{{ error_message }}</p>
    <div class="actions"><button type="button" onclick="location.reload()">もう一度読み込む</button><a class="secondary" href="/">ホームへ戻る</a></div>
  </section></main>
  <footer>Tabidea · 時間をおいても解決しない場合は、お問い合わせください。</footer>
</body>
</html>
